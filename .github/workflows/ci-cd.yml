name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test Python application
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SP2026_ENABLE_STREAMING: "false"
      SP2026_ENABLE_TRAFFIC_ANALYST: "false"
      SP2026_DB_HOST: 127.0.0.1
      SP2026_DB_PORT: "3306"
      SP2026_DB_USERNAME: ci
      SP2026_DB_PASSWORD: ci
      SP2026_DB_NAME: summer_project_2026_ci

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q app main.py

      - name: Run tests
        run: python -m pytest -q

  container-check:
    name: Validate container image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: local/backend:${{ github.sha }}

  publish:
    name: Publish ${{ github.ref_name }} image
    if: github.event_name == 'push'
    needs:
      - ci
      - container-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
